<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Temperature Converter</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="converter">
            <input type="text" id="inputValue" placeholder="Enter temperature">
            <div id="result"></div>
        
        <div class="buttons">
            <button class="convert-btn" data-from="C" data-to="F">C → F</button>
            <button class="convert-btn" data-from="C" data-to="K">C → K</button>
            <button class="convert-btn" data-from="F" data-to="C">F → C</button>
            <button class="convert-btn" data-from="F" data-to="K">F → K</button>
            <button class="convert-btn" data-from="K" data-to="C">K → C</button>
            <button class="convert-btn" data-from="K" data-to="F">K → F</button>
    </div>
</div>
<script src="script.js"></script>
</body>
</html>
